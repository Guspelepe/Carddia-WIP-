<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carddia - Menu</title>
    <link rel="stylesheet" href="css/menu.css">
    <link rel="stylesheet" href="css/base.css">
    <style>
        /* Estilos específicos do Menu */
        body.menu-page {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #2c3e50;
            color: #ecf0f1;
        }
        .menu-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            padding: 40px;
            background: #34495e;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(0,0,0,0.6);
            width: 500px;
            max-width: 90%;
        }
        .menu-logo {
            width: 300px;
            max-width: 100%;
            object-fit: contain;
        }
        .menu-input-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .menu-input-group label { font-weight: bold; font-size: 1.1em; }
        .menu-input-group input {
            padding: 12px 15px;
            border-radius: 8px;
            border: none;
            font-size: 1em;
            background: rgba(255,255,255,0.1);
            color: white;
            outline: 2px solid #7f8c8d;
        }
        .menu-input-group input:focus { outline-color: #3498db; }
        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            margin-top: 10px;
        }
        .menu-btn {
            padding: 15px;
            font-size: 1.2em;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            color: white;
            transition: transform 0.2s;
        }
        .menu-btn:hover { transform: scale(1.03); }
        .btn-online { background: linear-gradient(135deg, #e67e22, #f39c12); }
        .btn-bot { background: linear-gradient(135deg, #2980b9, #3498db); }
        
        /* Modal Configuração */
        .modal-field { margin-bottom: 15px; text-align: left; }
        .modal-field label { display: block; margin-bottom: 5px; font-size: 0.9em; }
        .modal-field select {
            width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid #ccc; font-size: 1em;
        }
        #btn-iniciar-partida {
            width: 100%; padding: 12px; background: #27ae60; border: none; color: white; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 1.1em;
        }
        #btn-iniciar-partida:hover { background: #2ecc71; }
    </style>
</head>
<body class="menu-page">
    <div class="menu-container">
        <img src="img/logo.png" alt="Carddia" class="menu-logo">
        
        <div class="menu-input-group">
            <label for="nickname">Seu Nickname:</label>
            <input type="text" id="nickname" placeholder="Digite seu nome..." value="Jogador 1">
        </div>

        <div class="menu-buttons">
            <button class="menu-btn btn-online" onclick="alert('🚧 Em breve! Estamos trabalhando no modo Online.')">Jogar Online</button>
            <button class="menu-btn btn-bot" onclick="abrirModalBot()">Jogar Contra Bot</button>
        </div>
    </div>

    <!-- Modal de Configuração -->
    <div id="modal-config" class="modal-overlay hidden">
        <div class="modal-content">
            <h2>Configurar Partida</h2>
            <div class="modal-field">
                <label for="modal-dificuldade">Dificuldade:</label>
                <select id="modal-dificuldade">
                    <option value="facil">Fácil</option>
                    <option value="medio" selected>Médio</option>
                    <option value="dificil">Difícil</option>
                </select>
            </div>
            <div class="modal-field">
                <label for="modal-melhor">Melhor de:</label>
                <select id="modal-melhor">
                    <option value="1">1 Vitória</option>
                    <option value="3" selected>3 Vitórias</option>
                    <option value="5">5 Vitórias</option>
                </select>
            </div>
            <button id="btn-iniciar-partida" onclick="iniciarJogo()">Iniciar Partida</button>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
