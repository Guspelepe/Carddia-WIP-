<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carddia - Login</title>
    <link rel="stylesheet" href="css/menu.css" />
    <link rel="stylesheet" href="css/base.css" />
    <!-- Firebase SDKs (CDN) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        /* Estilos adicionais para login */
        .auth-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .auth-container input {
            padding: 12px 15px;
            border-radius: 8px;
            border: none;
            font-size: 1em;
            background: rgba(255,255,255,0.1);
            color: white;
            outline: 2px solid #7f8c8d;
        }
        .auth-container input:focus {
            outline-color: #3498db;
        }
        .auth-container button {
            padding: 12px;
            font-size: 1.1em;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            background: #27ae60;
            transition: 0.2s;
        }
        .auth-container button:hover {
            transform: scale(1.02);
        }
        .auth-container .btn-secondary {
            background: #34495e;
        }
        .auth-container .btn-secondary:hover {
            background: #2c3e50;
        }
        .auth-switch {
            color: #bdc3c7;
            cursor: pointer;
            text-decoration: underline;
            font-size: 0.9em;
        }
        .auth-switch:hover {
            color: #ecf0f1;
        }
        .hidden {
            display: none !important;
        }
        .error-msg {
            color: #e74c3c;
            font-size: 0.9em;
            margin-top: 5px;
        }
    </style>
</head>
<body class="menu-page">
    <div class="menu-container">
        <img src="img/logo.png" alt="Carddia" class="menu-logo" />
        
        <div id="auth-container" class="auth-container">
            <!-- Formulário de Login -->
            <div id="login-form">
                <input type="email" id="login-email" placeholder="E-mail" />
                <input type="password" id="login-password" placeholder="Senha" />
                <button onclick="login()">Entrar</button>
                <button class="btn-secondary" onclick="showRegister()">Criar Conta</button>
                <div id="login-error" class="error-msg"></div>
            </div>

            <!-- Formulário de Cadastro -->
            <div id="register-form" class="hidden">
                <input type="email" id="register-email" placeholder="E-mail" />
                <input type="password" id="register-password" placeholder="Senha" />
                <input type="text" id="register-nick" placeholder="Nickname" />
                <button onclick="register()">Cadastrar</button>
                <button class="btn-secondary" onclick="showLogin()">Voltar</button>
                <div id="register-error" class="error-msg"></div>
            </div>
        </div>

        <!-- Mensagem de boas-vindas (aparece após login) -->
        <div id="welcome-msg" class="hidden" style="text-align:center;">
            <p>Bem-vindo, <span id="user-nick"></span>!</p>
            <button onclick="goToLobby()" style="padding:12px 30px; background:#3498db; border:none; border-radius:8px; color:white; font-weight:bold; cursor:pointer;">
                Entrar no Lobby
            </button>
        </div>
    </div>

    <script>
        // ========== CONFIGURAÇÃO FIREBASE (SUBSTITUA PELA SUA CHAVE) ==========
        const firebaseConfig = {
            apiKey: "AIzaSyCBAjjFzRPB013mCC5mVGs-rojDla9uChk",
            authDomain: "carddia-card-game.firebaseapp.com",
            projectId: "carddia-card-game",
            storageBucket: "carddia-card-game.firebasestorage.app",
            messagingSenderId: "934272406141",
            appId: "1:934272406141:web:204496eb4f51045df15714"
        };
        // Inicialização (sintaxe compat, sem import)
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Elementos
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const welcomeMsg = document.getElementById('welcome-msg');
        const userNickSpan = document.getElementById('user-nick');

        function showLogin() {
            loginForm.classList.remove('hidden');
            registerForm.classList.add('hidden');
        }

        function showRegister() {
            loginForm.classList.add('hidden');
            registerForm.classList.remove('hidden');
        }

        // Login
        function login() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const errorDiv = document.getElementById('login-error');
            errorDiv.textContent = '';
            auth.signInWithEmailAndPassword(email, password)
                .then(() => {
                    window.location.href = 'lobby.html';
                })
                .catch(error => {
                    errorDiv.textContent = error.message;
                });
        }

        // Cadastro
        function register() {
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            const nick = document.getElementById('register-nick').value.trim();
            const errorDiv = document.getElementById('register-error');
            errorDiv.textContent = '';
            if (!nick) {
                errorDiv.textContent = 'Digite um nickname.';
                return;
            }
            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    const uid = userCredential.user.uid;
                    return db.collection('users').doc(uid).set({
                        nickname: nick,
                        email: email,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                })
                .then(() => {
                    alert('Conta criada! Faça login.');
                    showLogin();
                    document.getElementById('login-email').value = email;
                    document.getElementById('login-password').value = '';
                    document.getElementById('register-email').value = '';
                    document.getElementById('register-password').value = '';
                    document.getElementById('register-nick').value = '';
                })
                .catch(error => {
                    errorDiv.textContent = error.message;
                });
        }

        // Verifica se o usuário já está logado
        auth.onAuthStateChanged(user => {
            if (user) {
                db.collection('users').doc(user.uid).get()
                    .then(doc => {
                        if (doc.exists) {
                            const nick = doc.data().nickname;
                            userNickSpan.textContent = nick;
                            loginForm.classList.add('hidden');
                            registerForm.classList.add('hidden');
                            welcomeMsg.classList.remove('hidden');
                            // Redireciona automaticamente após 2 segundos
                            setTimeout(() => {
                                window.location.href = 'lobby.html';
                            }, 2000);
                        }
                    });
            }
        });

        function goToLobby() {
            window.location.href = 'lobby.html';
        }

        // Expõe funções globalmente
        window.login = login;
        window.register = register;
        window.showLogin = showLogin;
        window.showRegister = showRegister;
        window.goToLobby = goToLobby;
    </script>
</body>
</html>
