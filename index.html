<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carddia - Acesso</title>
    
    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">

    <!-- Estilos -->
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/login.css" />

    <!-- Firebase SDKs (CDN) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body class="login-page">
    
    <!-- Container Principal (Layout Bookly) -->
    <div class="landing-container">
        
        <!-- Coluna da Imagem (Esquerda) -->
        <div class="col-imagem">
            <!-- O gradiente é aplicado via CSS -->
            <div class="frase-container">
                <p id="frase-destaque">"A jornada mais longa começa com um único passo."</p>
            </div>
        </div>

        <!-- Coluna do Formulário (Direita) -->
        <div class="col-form">
            <!-- Logo -->
            <img src="img/logo.png" alt="Carddia" class="logo-login" />

            <!-- Card de Login -->
            <div class="card">
                <h1><span>Login</span></h1>
                <p class="subtitulo">Acesse o campo de batalha</p>

                <!-- Formulário de Login -->
                <div id="login-form" class="auth-container">
                    <div class="campo">
                        <label for="login-email">E-mail</label>
                        <input type="email" id="login-email" placeholder="Digite seu e-mail" />
                    </div>
                    <div class="campo">
                        <label for="login-password">Senha</label>
                        <input type="password" id="login-password" placeholder="Digite sua senha" />
                    </div>
                    
                    <button type="button" onclick="login()" class="btn-entrar">Entrar</button>
                    
                    <div id="login-error" class="error-msg"></div>
                    
                    <button type="button" class="btn-registrar" onclick="showRegister()">Ainda não tem conta? Registre-se</button>
                </div>

                <!-- Formulário de Cadastro (Oculto inicialmente) -->
                <div id="register-form" class="auth-container hidden">
                    <div class="campo">
                        <label for="register-email">E-mail</label>
                        <input type="email" id="register-email" placeholder="Digite seu e-mail" />
                    </div>
                    <div class="campo">
                        <label for="register-password">Senha</label>
                        <input type="password" id="register-password" placeholder="Digite sua senha" />
                    </div>
                    <div class="campo">
                        <label for="register-nick">Nickname</label>
                        <input type="text" id="register-nick" placeholder="Seu apelido" />
                    </div>

                    <button type="button" onclick="register()" class="btn-entrar">Cadastrar</button>
                    
                    <div id="register-error" class="error-msg"></div>

                    <button type="button" class="btn-registrar" onclick="showLogin()">Voltar para Login</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ========== CONFIGURAÇÃO FIREBASE ==========
        const firebaseConfig = {
            apiKey: "AIzaSyCBAjjFzRPB013mCC5mVGs-rojDla9uChk",
            authDomain: "carddia-card-game.firebaseapp.com",
            projectId: "carddia-card-game",
            storageBucket: "carddia-card-game.firebasestorage.app",
            messagingSenderId: "934272406141",
            appId: "1:934272406141:web:204496eb4f51045df15714"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Elementos
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');

        function showLogin() {
            loginForm.classList.remove('hidden');
            registerForm.classList.add('hidden');
            document.getElementById('login-error').textContent = '';
        }

        function showRegister() {
            loginForm.classList.add('hidden');
            registerForm.classList.remove('hidden');
            document.getElementById('register-error').textContent = '';
        }

        // Login
        function login() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const errorDiv = document.getElementById('login-error');
            errorDiv.textContent = '';
            
            auth.signInWithEmailAndPassword(email, password)
                .then(() => {
                    window.location.href = 'lobby.html';
                })
                .catch(error => {
                    errorDiv.textContent = error.message;
                });
        }

        // Cadastro
        function register() {
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            const nick = document.getElementById('register-nick').value.trim();
            const errorDiv = document.getElementById('register-error');
            errorDiv.textContent = '';
            
            if (!nick) {
                errorDiv.textContent = 'Digite um nickname.';
                return;
            }
            
            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    const uid = userCredential.user.uid;
                    return db.collection('users').doc(uid).set({
                        nickname: nick,
                        email: email,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                })
                .then(() => {
                    alert('Conta criada com sucesso!');
                    showLogin();
                    document.getElementById('login-email').value = email;
                    document.getElementById('login-password').value = '';
                    document.getElementById('register-email').value = '';
                    document.getElementById('register-password').value = '';
                    document.getElementById('register-nick').value = '';
                })
                .catch(error => {
                    errorDiv.textContent = error.message;
                });
        }

        // Verifica se o usuário já está logado
        auth.onAuthStateChanged(user => {
            if (user) {
                window.location.href = 'lobby.html';
            }
        });

        // Expõe funções globalmente
        window.login = login;
        window.register = register;
        window.showLogin = showLogin;
        window.showRegister = showRegister;
    </script>
</body>
</html>
